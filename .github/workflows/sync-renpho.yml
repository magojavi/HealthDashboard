name: Sync Renpho weight data

on:
  schedule:
    # 06:00 UTC daily (adjust as you like) — cron is always UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Renpho sync
        env:
          RENPHO_EMAIL: ${{ secrets.RENPHO_EMAIL }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: node scripts/sync-renpho.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "renpho-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/weight.json; then
            echo "No changes to commit."
          else
            git add data/weight.json
            git commit -m "Auto-sync Renpho weight data ($(date -u +%Y-%m-%d))"
            git push
          fi
