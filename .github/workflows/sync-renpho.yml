name: Sync Renpho weight data

on:
  schedule:
    # Cron always runs in UTC, and Berlin shifts between UTC+1 (CET, winter)
    # and UTC+2 (CEST, summer), so two schedules are needed to land at
    # 09:00 Berlin time year-round. Running both is harmless — the script
    # is idempotent and simply finds nothing new on the "wrong" one.
    - cron: '0 7 * * *'  # 09:00 Berlin during CEST (late Mar–late Oct)
    - cron: '0 8 * * *'  # 09:00 Berlin during CET (late Oct–late Mar)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Renpho sync
        env:
          RENPHO_EMAIL: ${{ secrets.RENPHO_EMAIL }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: node scripts/sync-renpho.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "renpho-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/weight.json; then
            echo "No changes to commit."
          else
            git add data/weight.json
            git commit -m "Auto-sync Renpho weight data ($(date -u +%Y-%m-%d))"
            git push
          fi
