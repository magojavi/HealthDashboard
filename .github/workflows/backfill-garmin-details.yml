name: Backfill Garmin activity details (one-time)

on:
  workflow_dispatch: {}   # manual trigger only — no schedule, this only needs to run once

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect

      - name: Run backfill (this can take a few minutes)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/backfill-garmin-details.py

      - name: Commit and push if changed
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/activities.json; then
            echo "No changes to commit."
          else
            git add data/activities.json
            git commit -m "One-time backfill: enrich historical activities with full Garmin detail"
            git push
          fi
